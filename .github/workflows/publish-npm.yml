name: publish-npm

# Optional path for publishing the npm package through GitHub's OIDC trusted
# publishing. The normal release is still: `npm stage publish` on the maintainer's
# machine, then approve the staged package on npmjs.com.
#
# This workflow runs only when started by hand, so a tag push never turns into a red
# run while a trusted publisher is not configured. To use it, configure the trusted
# publisher on npmjs.com (package page → Settings → Trusted Publisher → GitHub
# Actions, workflow `publish-npm.yml`), then run this workflow on the release tag.
#
# The plugin is Windows-only — its native dependency declares `os: win32` — so the job
# runs on Windows; an ubuntu runner cannot even complete `npm ci`.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # The plugin is Windows-only where it runs, but everything `npm test` exercises is
      # plain Node. Skipping install scripts keeps Electron (110 MB) off the runner.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) { throw "tag v$tag does not match package.json version $version" }

      # `prepare` runs while packing, but it recognises a working copy (a .git directory)
      # and skips the runtime assembly, so no Electron is downloaded here.
      - name: Stage the version for approval
        run: npm stage publish
