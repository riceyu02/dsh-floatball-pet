name: publish-npm

# Publish the npm package through GitHub's OIDC trusted publishing. A tag push stages
# that version for approval; a maintainer approves it on npmjs.com (Staged Packages →
# Approve). The trusted publisher must name this workflow: package page → Settings →
# Trusted Publisher → GitHub Actions, workflow `publish-npm.yml`.
#
# No manual `npm stage publish` is needed any more; running both for one version only
# makes the second one fail because that version is already staged.
#
# The plugin is Windows-only — its native dependency declares `os: win32` — so the job
# runs on Windows; an ubuntu runner cannot even complete `npm ci`.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # The plugin is Windows-only where it runs, but everything `npm test` exercises is
      # plain Node. Skipping install scripts keeps Electron (110 MB) off the runner.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) { throw "tag v$tag does not match package.json version $version" }

      # `prepare` runs while packing, but it recognises a working copy (a .git directory)
      # and skips the runtime assembly, so no Electron is downloaded here.
      - name: Stage the version for approval
        run: npm stage publish
