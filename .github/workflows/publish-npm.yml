name: publish-npm

# The npm package is not the GitHub Release artifact: the Release carries the 114 MB
# all-in-one bundle (runtime inside), while npm gets the 1.7 MB runtime-less package
# whose `postinstall` assembles the runtime on the user's machine. Publishing them from
# one tag keeps the version numbers in step.
#
# Authentication is npm trusted publishing (OIDC), so there is no token secret. Configure
# it once on npmjs.com: package page → Settings → Trusted Publisher → GitHub Actions,
# user `riceyu02`, repository `dsh-floatball-pet`, workflow `publish-npm.yml`. Trusted
# publishers created after 2026-09-03 are set to allow `npm stage publish` only, which is
# why this workflow stages the version and a maintainer approves it on npmjs.com
# (Staged Packages → Approve). Tick "npm publish" in that config to publish directly.
#
# See docs/npm-publish.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # The plugin is Windows-only where it runs, but everything `npm test` exercises is
      # plain Node. Skipping install scripts keeps Electron (110 MB) off the runner.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      # `prepare` runs while packing, but it recognises a working copy (a .git directory)
      # and skips the runtime assembly, so no Electron is downloaded here.
      - name: Stage the version for approval
        run: npm stage publish

      # To publish without the manual approval step, allow "npm publish" on the trusted
      # publisher and replace the command above with: npm publish --provenance
