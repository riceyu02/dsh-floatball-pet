name: release

# Push a tag like v0.2.0 and the plugin package is packed and attached to the
# matching GitHub Release. The tarball carries no runtime (about 1.7 MB); the
# install hook downloads Electron on the user's machine.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `prepare` is a no-op inside a working copy; the runtime is assembled on
      # purpose by build:dsh-plugin, into a temporary directory.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            throw "tag v$tag does not match package.json version $pkg"
          }

      - name: Pack the plugin (no runtime; the install hook downloads it)
        run: npm pack

      - name: Report the artifact
        shell: pwsh
        run: |
          Get-ChildItem dsh-floatball-pet-*.tgz | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "artifact: $($_.Name)  $([math]::Round($_.Length / 1MB, 2)) MB"
            "sha256:   $hash"
          }

      - name: Extract the release notes from RELEASE-NOTES.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content RELEASE-NOTES.md -Encoding utf8
          $heading = "## $version"
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].Trim() -eq $heading) { $start = $i; break }
          }
          if ($start -lt 0) { throw "RELEASE-NOTES.md has no '$heading' section; add one before tagging" }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## ') { $end = $i; break }
          }
          if ($end -le $start + 1) { throw "the '$heading' section in RELEASE-NOTES.md is empty" }
          $body = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          if (-not $body) { throw "the '$heading' section in RELEASE-NOTES.md is empty" }
          Set-Content -Path release-notes.md -Value $body -Encoding utf8

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-floatball-pet-*.tgz
          body_path: release-notes.md
