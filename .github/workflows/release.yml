name: release

# Push a tag like v0.2.1 and the plugin installer is built and attached to the
# matching GitHub Release. The bundle carries a full Electron runtime, so the
# artifact is ~113 MB and is deliberately not stored in git.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `prepare` is a no-op inside a working copy; the runtime is assembled on
      # purpose by build:dsh-plugin, into a temporary directory.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            throw "tag v$tag does not match package.json version $pkg"
          }

      - name: Build the DSH plugin bundle
        run: npm run build:dsh-plugin

      - name: Report the artifact
        shell: pwsh
        run: |
          Get-ChildItem artifacts/*.tgz | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "artifact: $($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB"
            "sha256:   $hash"
          }

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tgz
          generate_release_notes: true
